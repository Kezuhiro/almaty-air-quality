<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almaty Air - Экологический мониторинг</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bs-body-font-family: 'Manrope', sans-serif;
            --app-surface: rgba(255, 255, 255, 0.78);
            --app-shadow: 0 18px 45px rgba(15, 23, 42, 0.1);
            --app-glow: 0 0 36px rgba(37, 99, 235, 0.22);
        }
        [data-bs-theme="dark"] {
            --app-surface: rgba(17, 24, 39, 0.78);
            --app-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
            --app-glow: 0 0 36px rgba(56, 189, 248, 0.16);
        }
        html { scroll-behavior: smooth; }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background:
                radial-gradient(circle at 8% -10%, rgba(37, 99, 235, 0.11), transparent 28rem),
                radial-gradient(circle at 96% 4%, rgba(20, 184, 166, 0.09), transparent 24rem),
                var(--bs-body-bg);
        }
        footer { margin-top: auto; }
        .navbar { backdrop-filter: blur(18px); background-color: var(--app-surface) !important; }
        .navbar-brand { font-weight: 800; letter-spacing: -0.02em; }
        .navbar-brand i {
            width: 2.1rem;
            height: 2.1rem;
            border-radius: 0.65rem;
            display: inline-grid;
            place-items: center;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #14b8a6);
            box-shadow: var(--app-glow);
        }
        .text-orange { color: #fd7e14 !important; }
        .bg-orange { background-color: #fd7e14 !important; color: #fff; }
        .card, .btn, .badge, .nav-link { transition: all 0.2s ease; }
        .btn { font-weight: 700; }
        .navbar .nav-link { border-radius: 999px; padding-inline: 0.85rem !important; font-weight: 650; }
        .navbar .nav-link:hover { background: var(--bs-tertiary-bg); }
        .navbar .nav-link.active {
            font-weight: 800;
            color: #fff !important;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.22);
        }
        #bd-theme {
            border-radius: 999px;
            width: 2.35rem;
            height: 2.35rem;
            display: inline-grid;
            place-items: center;
        }
        .footer-note { color: var(--bs-secondary-color); }
        .app-fade-in { animation: app-fade-in 0.55s ease both; }
        @keyframes app-fade-in {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg border-bottom sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand text-primary d-flex align-items-center gap-2" href="/">
            <i class="bi bi-clouds-fill"></i> Almaty Air
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link {% if active_page == 'home' %}active{% endif %}" href="/" data-lang="nav_home">Главная</a></li>
                <li class="nav-item"><a class="nav-link {% if active_page == 'forecast' %}active{% endif %}" href="/forecast" data-lang="nav_forecast">Прогноз</a></li>
                <li class="nav-item"><a class="nav-link {% if active_page == 'simulation' %}active{% endif %}" href="/simulation" data-lang="nav_simulation">Симуляция</a></li>
                <li class="nav-item"><a class="nav-link {% if active_page == 'history' %}active{% endif %}" href="/history" data-lang="nav_history">История</a></li>
                <li class="nav-item"><a class="nav-link {% if active_page == 'about' %}active{% endif %}" href="/about" data-lang="nav_about">О проекте</a></li>
                <li class="nav-item border-start mx-3 d-none d-lg-block" style="height: 24px;"></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-globe"></i> <span id="current-lang-text">RU</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                        <li><button class="dropdown-item" onclick="changeLang('ru')">Русский</button></li>
                        <li><button class="dropdown-item" onclick="changeLang('kk')">Қазақша</button></li>
                        <li><button class="dropdown-item" onclick="changeLang('en')">English</button></li>
                    </ul>
                </li>
                <li class="nav-item ms-2">
                    <button class="btn btn-link nav-link" id="bd-theme" aria-label="Toggle theme"><i class="bi bi-moon-stars-fill"></i></button>
                </li>
            </ul>
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

<footer class="border-top py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0 small footer-note">© 2026 Almaty Air. <span data-lang="footer_text">Дипломный проект по мониторингу качества воздуха.</span></p>
    </div>
</footer>

        }
    };

    const resolveTranslationKey = (rawKey, dict) => {
        if (dict[rawKey]) return rawKey;
        for (const prefix in dynamicKeyAliases) {
            if (rawKey.startsWith(prefix)) {
                const suffix = rawKey.slice(prefix.length);
                const alias = dynamicKeyAliases[prefix][suffix];
                if (alias && dict[alias]) return alias;
            }
        }
        return rawKey;
    };

    function changeLang(lang) {
        const dict = translations[lang] || translations.ru;
        localStorage.setItem('lang', lang);
        document.getElementById('current-lang-text').innerText = lang.toUpperCase();

        document.querySelectorAll('[data-lang]').forEach((el) => {
            const rawKey = el.getAttribute('data-lang');
            const key = resolveTranslationKey(rawKey, dict);
            if (dict[key]) el.textContent = dict[key];
        });

        document.querySelectorAll('[data-lang-placeholder]').forEach((el) => {
            const rawKey = el.getAttribute('data-lang-placeholder');
            const key = resolveTranslationKey(rawKey, dict);
            if (dict[key]) el.placeholder = dict[key];
        });

        document.dispatchEvent(new CustomEvent('langChanged', { detail: { lang, dict } }));
    }

    document.addEventListener('DOMContentLoaded', () => {
        changeLang(localStorage.getItem('lang') || 'ru');
    });

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/static/service-worker.js')
        .then(reg => console.log('SW Registered!', reg))
        .catch(err => console.log('SW Registration failed:', err));
    });
  }

  // Функция для подписки на Push (вызывай её, например, кнопкой "Включить уведомления")
  async function subscribeToPush() {
    const registration = await navigator.serviceWorker.ready;
    
    // Тебе понадобятся VAPID ключи (сгенерируем на шаге 4)
    const publicVapidKey = 'ТВОЙ_PUBLIC_VAPID_KEY';
    
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: publicVapidKey
    });

    // Отправляем подписку на бэкенд FastAPI
    await fetch('/api/subscribe', {
      method: 'POST',
      body: JSON.stringify(subscription),
      headers: { 'Content-Type': 'application/json' }
    });
    
    alert('Уведомления включены!');
  }
</script>
